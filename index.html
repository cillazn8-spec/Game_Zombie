<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZOMBIE SURVIVAL: LAST STAND</title>
    <meta name="description" content="Game 3D Third-Person Zombie Survival menggunakan Three.js dan WebGL untuk demonstrasi Panen Karya SMK RPL." />
    <meta name="theme-color" content="#07090d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZombieRPG" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="ZOMBIE SURVIVAL: LAST STAND" />
    <meta property="og:description" content="Bertahan hidup dari gelombang serangan zombie di kota terbengkalai dalam game aksi 3D WebGL." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#07090d] text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (ev) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;background:#07090d;color:#f8fafc;font-family:sans-serif;text-align:center;">' +
            '<div style="max-width:420px;background:#0b101b;border:1px solid rgba(251,191,36,0.4);border-radius:12px;padding:20px;">' +
            '<h2 style="margin:0 0 8px;color:#fbbf24;font-size:18px;">WebView Emulator Perlu Diperbarui</h2>' +
            '<p style="margin:0 0 12px;font-size:13px;color:#cbd5e1;line-height:1.5;">Game gagal dimuat pada Android WebView emulator ini. Aktifkan OpenGL di pengaturan emulator atau perbarui Android System WebView.</p>' +
            '<pre style="text-align:left;font-size:11px;color:#fca5a5;background:#020617;padding:8px;border-radius:6px;overflow:auto;">' +
            String(ev && ev.message ? ev.message : 'Script boot error') +
            '</pre></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
